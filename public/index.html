<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO — multiple-example</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>TODO</h1>
    <form id="form">
      <input id="title" type="text" placeholder="What needs doing?" required>
      <input id="tags" type="text" placeholder="#tag1 #tag2 (space or comma separated)">
      <button type="submit">Add</button>
    </form>
    <div id="filter-bar" hidden>
      <span class="filter-label">Filtering (AND):</span>
      <span id="active-tags"></span>
      <button type="button" id="clear-filter">Clear</button>
    </div>
    <ul id="list"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
